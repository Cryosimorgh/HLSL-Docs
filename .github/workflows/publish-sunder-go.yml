name: Publish Sunder Go HLSL Workbench Windows release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-sunder-go.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunder-go-v2.1.0-release
  cancel-in-progress: false

jobs:
  linux-go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Run all Go unit tests with race detector
        run: cd go-server && go test -race ./...

  windows-release:
    needs: linux-go-tests
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Set up Node for offline editor vendoring
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pinned offline CodeMirror assets
        run: node playground/install-editor-vendor.mjs
      - name: Restore DXC and Naga from the previous official Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'HLSL-Playground-Windows-v1.9.1.zip'
          $url = 'https://github.com/Cryosimorgh/HLSL-Docs/releases/download/v1.9.1/HLSL-Playground-Windows-v1.9.1.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-Item $archive).Length -lt 1000000) { throw 'Prior toolchain archive is unexpectedly small' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'v1.9.1-toolchain'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked -Force
          New-Item -ItemType Directory -Force -Path 'tools/dxc','tools/naga' | Out-Null
          $bins = @{
            'dxc.exe' = 'tools/dxc'
            'dxcompiler.dll' = 'tools/dxc'
            'dxil.dll' = 'tools/dxc'
            'naga.exe' = 'tools/naga'
          }
          foreach ($name in $bins.Keys) {
            $source = Get-ChildItem -LiteralPath $unpacked -File -Recurse -Filter $name | Select-Object -First 1
            if (-not $source) { throw "Missing required toolchain file: $name" }
            Copy-Item -LiteralPath $source.FullName -Destination $bins[$name] -Force
          }
          Write-Host 'Restored bundled DXC, DXIL and Naga tools.'
      - name: Run Windows-compatible Go host tests
        shell: pwsh
        run: |
          Push-Location go-server
          go test -v -run 'TestPersistentServerAndHostSecurity|TestOpenSaveAndConflicts' ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go host tests failed' }
          Pop-Location
      - name: Build Windows desktop executable with embedded icon
        shell: pwsh
        run: |
          $resource = 'go-server/icon_windows_amd64.syso'
          if (-not (Test-Path -LiteralPath $resource)) {
            certutil -f -decode 'go-server/icon_windows_amd64.syso.b64' $resource | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore Windows icon resource' }
          }
          Push-Location go-server
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.appVersion=v2.1.0" -o '../HLSLWorkbench.exe' .
          if ($LASTEXITCODE -ne 0) { throw 'Windows Go build failed' }
          Pop-Location
      - name: Smoke-test actual DXC to Naga translation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $shader = Join-Path $env:RUNNER_TEMP 'sunder-release-smoke.hlsl'
          $spv = Join-Path $env:RUNNER_TEMP 'sunder-release-smoke.spv'
          $wgsl = Join-Path $env:RUNNER_TEMP 'sunder-release-smoke.wgsl'
          '[numthreads(8,8,1)] void CSMain(uint3 tid : SV_DispatchThreadID) { }' | Set-Content -LiteralPath $shader -Encoding ascii
          & 'tools/dxc/dxc.exe' -spirv -fspv-target-env=vulkan1.1 -T cs_6_0 -E CSMain -Fo $spv $shader
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $spv)) { throw 'DXC smoke test failed' }
          & 'tools/naga/naga.exe' $spv $wgsl
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $wgsl)) { throw 'Naga smoke test failed' }
          $translated = Get-Content -LiteralPath $wgsl -Raw
          if ($translated -notmatch '@compute') { throw 'Translated WGSL has no compute entry point' }
      - name: Assemble complete portable ZIP and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'Sunder-HLSL-Workbench-Go-v2.1.0-Windows-x64'
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $top = @(
            'HLSLWorkbench.exe',
            'Start-HLSL-Workbench.cmd',
            'Stop-HLSL-Workbench.cmd',
            'Install-File-Association.cmd',
            'Uninstall-File-Association.cmd',
            'BUILD-WINDOWS.cmd',
            'LICENSE',
            'THIRD_PARTY_NOTICES.md',
            'HLSL-Handbook.md'
          )
          foreach ($path in $top) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing release file: $path" }
            Copy-Item -LiteralPath $path -Destination $stage -Force
          }
          foreach ($path in @('playground','go-server','tools','docs')) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing release directory: $path" }
            Copy-Item -LiteralPath $path -Destination $stage -Recurse -Force
          }
          foreach ($file in @(
            'playground/index.html',
            'playground/vendor/codemirror/codemirror.js',
            'playground/sunder-ide.css',
            'playground/sunder-ide.js',
            'tools/dxc/dxc.exe',
            'tools/dxc/dxcompiler.dll',
            'tools/dxc/dxil.dll',
            'tools/naga/naga.exe'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $file))) { throw "Packaged file missing: $file" }
          }
          @'
          # Sunder HLSL Workbench — Go Edition v2.0.0

          Extract the complete archive into a permanent directory on Windows x64.

          Double-click Start-HLSL-Workbench.cmd to start the persistent Go localhost
          server. Closing browser tabs does not stop it. To stop it, run
          Stop-HLSL-Workbench.cmd or use the IDE's Stop Server control.

          To register Open with for .hlsl and .hlsli, run
          Install-File-Association.cmd. Windows still requires you to explicitly
          choose Sunder as the default application.

          The offline CodeMirror editor, DXC, Naga, HLSL examples and documentation
          are bundled. End users do not need Go, Node or PowerShell for hosting.
          Browser WebGPU support is required for GPU execution.

          Windows build, Go unit tests and DXC-to-Naga smoke checks run in CI.
          Real GPU/driver performance is not qualified by those checks.
          '@ | Set-Content -LiteralPath (Join-Path $stage 'README-GO-RELEASE.md') -Encoding utf8
          $zip = Join-Path $PWD ($name + '.zip')
          Compress-Archive -LiteralPath $stage -DestinationPath $zip -CompressionLevel Optimal -Force
          if ((Get-Item $zip).Length -lt 1000000) { throw 'Release archive is unexpectedly small' }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content -LiteralPath ($zip + '.sha256') -Encoding ascii
          Write-Host "Prepared $zip ($hash)"
          # Publish each managed app file independently for delta updates.
          $deltaDir = Join-Path $PWD 'release-delta-assets'
          python scripts/build_update_manifest.py $stage 'v2.1.0' $deltaDir
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create per-file delta manifest' }
          $manifest = Get-Content -LiteralPath (Join-Path $deltaDir 'sunder-update-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.files.Count -lt 10) { throw 'Update manifest has too few files' }
      - name: Publish v2.1.0 GitHub Release with per-file update assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v2.1.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to overwrite it" }
          @'
          Sunder HLSL Workbench v2.1.0: verified incremental updates, higher-resolution HLSL output, GPU-native preview and faster repeat compilation.

          - Standalone, persistent localhost Go server (closing a browser tab does not stop it).
          - Branded Windows executable with embedded icon.
          - Optional .hlsl/.hlsli Open with registration and safe on-disk editing.
          - Violet IDE with shader editor, autocomplete, HLSL docs, GPU preview and diagnostics.
          - Download only files whose SHA-256 differs, then confirm restart/install.
          - Max FPS mode with direct WebGPU storage-buffer preview and periodic statistics.
          - Framebuffer sizes 1–2048 per axis (64 MiB float4 cap and GPU device limits).
          - DXC fast-edit (-O1) or optimized (-O3) modes and persistent compilation cache.
          - Bundled CodeMirror, DXC and Naga: no Go, Node or PowerShell required at runtime.

          The downloadable Windows x64 ZIP was rebuilt by GitHub Actions from this
          release's source; Go unit tests and real DXC-to-Naga smoke translation passed.
          WebGPU operation depends on the user's graphics hardware and browser.
          Native GPU/driver performance remains unqualified.
          '@ | Set-Content -LiteralPath 'SUNDER-GO-RELEASE-NOTES.md' -Encoding utf8
          $zip = 'Sunder-HLSL-Workbench-Go-v2.1.0-Windows-x64.zip'
          # Publish as draft until every delta asset is uploaded successfully.
          $deltaDir = Join-Path $PWD 'release-delta-assets'
          $manifestFile = Join-Path $deltaDir 'sunder-update-manifest.json'
          gh release create $tag $zip ($zip + '.sha256') $manifestFile --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Sunder HLSL Workbench v2.1.0 — Delta Updates & GPU Performance' --notes-file SUNDER-GO-RELEASE-NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release' }
          foreach ($asset in @(Get-ChildItem -LiteralPath $deltaDir -Filter 'delta-*.bin' -File)) {
            gh release upload $tag $asset.FullName --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw ("Failed to upload delta asset: " + $asset.Name) }
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish complete release' }
          Write-Host ("Published "+$tag+" with "+@(Get-ChildItem -LiteralPath $deltaDir -Filter 'delta-*.bin' -File).Count+" delta assets")
