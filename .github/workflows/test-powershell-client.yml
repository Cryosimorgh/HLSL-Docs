name: PowerShell HLSL client and tab lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'playground/server.ps1'
      - 'playground/test-powershell.mjs'
      - 'Start-HLSL-Playground.ps1'
      - '.github/workflows/test-powershell-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-server:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test server with Windows PowerShell 5.1
        shell: pwsh
        run: |
          node playground/test-powershell.mjs
          if ($LASTEXITCODE -ne 0) { throw "PowerShell host smoke test failed" }
      - name: Acquire upstream DXC (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'dxc-release.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'dxc-release'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' -OutFile $zip -MaximumRetryCount 4 -RetryIntervalSec 10
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          if (-not (Test-Path (Join-Path $dir 'bin\x64\dxc.exe'))) { throw 'DXC binary missing' }
      - name: Extract precompiled Naga without extracting the old custom server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'older-naga-bundle.zip'
          $dst = Join-Path $env:RUNNER_TEMP 'prebuilt-naga.exe'
          Invoke-WebRequest -Uri 'https://github.com/Cryosimorgh/HLSL-Docs/releases/download/v1.2.0/HLSL-Playground-Windows-v1.2.0.zip' -OutFile $zip -MaximumRetryCount 4 -RetryIntervalSec 10
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entry = $archive.Entries | Where-Object { $_.FullName -eq 'HLSL-Playground-Windows-v1.2.0/tools/naga/naga.exe' } | Select-Object -First 1
            if (-not $entry) { throw 'Prebuilt Naga missing from source archive' }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $dst, $true)
          } finally { $archive.Dispose() }
          & $dst --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Naga cannot run' }
      - name: Compile real HLSL to WGSL via the PowerShell API
        shell: pwsh
        run: |
          $env:HLSL_TEST_DXC = Join-Path $env:RUNNER_TEMP 'dxc-release\bin\x64\dxc.exe'
          $env:HLSL_TEST_NAGA = Join-Path $env:RUNNER_TEMP 'prebuilt-naga.exe'
          node playground/test-powershell.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Real compiler HTTP integration failed' }

      - name: Verify clean source checkout downloads only compiler tools and runs HLSL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HLSL_BOOTSTRAP_CACHE = Join-Path $env:RUNNER_TEMP ('source-tools-' + [guid]::NewGuid().ToString('N'))
          try {
            if (Test-Path 'tools\dxc\dxc.exe') { throw 'Test expects no compiler binaries in source checkout' }
            & ./Start-HLSL-Playground.ps1 -NoBrowser
            $toolRoot = Join-Path $env:HLSL_BOOTSTRAP_CACHE 'v1.5.0'
            if (-not (Test-Path (Join-Path $toolRoot 'tools\dxc\dxc.exe'))) { throw 'DXC bootstrap failed' }
            if (-not (Test-Path (Join-Path $toolRoot 'tools\naga\naga.exe'))) { throw 'Naga bootstrap failed' }
            $ready=Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'hlsl-playground-run-*' |
              Sort-Object LastWriteTime -Descending |
              ForEach-Object { Join-Path $_.FullName 'ready.json' } |
              Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $ready) { throw 'No ready file from checkout launch' }
            $info=Get-Content -LiteralPath $ready -Raw | ConvertFrom-Json
            $health=Invoke-RestMethod -Uri "$($info.url)/api/health"
            if ($health.backend -ne 'powershell-dotnet') { throw 'Incorrect compiler backend' }
            $session=Invoke-RestMethod -Uri "$($info.url)/api/session/open" -Method POST -ContentType 'application/json' -Body '{}'
            try {
              $hlsl=Get-Content -LiteralPath 'playground/particle-step.hlsl' -Raw
              $payload=@{entry='CSMain';source=$hlsl} | ConvertTo-Json -Compress
              $output=Invoke-RestMethod -Uri "$($info.url)/api/compile" -Method POST -ContentType 'application/json' -Body $payload
              if ($output.wgsl -notmatch '@compute') { throw 'Source checkout compiler produced no WGSL' }
            } finally {
              $closed=@{token=$session.token} | ConvertTo-Json -Compress
              Invoke-RestMethod -Uri "$($info.url)/api/session/close" -Method POST -ContentType 'application/json' -Body $closed | Out-Null
            }
            $exited=$false
            for($i=0;$i -lt 40;$i++){
              Start-Sleep -Milliseconds 250
              if(-not (Get-Process -Id $info.pid -ErrorAction SilentlyContinue)) { $exited=$true; break }
            }
            if(-not $exited) {
              Stop-Process -Id $info.pid -Force -ErrorAction SilentlyContinue
              throw 'Checkout compiler process did not shut down'
            }
            Write-Host 'PASS: fresh checkout auto-download, SHA256 verification, HLSL compile and tab cleanup'
          } finally {
            Remove-Item Env:\HLSL_BOOTSTRAP_CACHE -ErrorAction SilentlyContinue
          }
