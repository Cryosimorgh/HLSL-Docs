name: HLSL playground frontend checks
on:
  push:
    branches: [main]
    paths:
      - 'playground/index.html'
      - 'playground/workbench.css'
      - 'playground/hlsl-highlight.js'
      - 'playground/test-hlsl-highlight.mjs'
      - 'playground/live-runner.js'
      - 'playground/animation-runner.js'
      - 'playground/test-animation.mjs'
      - 'playground/julia-loop.hlsl'
      - 'playground/gpu-visualizer.js'
      - 'playground/test-gpu-visualizer.mjs'
      - 'playground/circle-mask.hlsl'
      - 'playground/test-frontend.mjs'
      - '.github/workflows/hlsl-live-runner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript and editable controls
        run: |
          node playground/test-frontend.mjs
          node playground/test-gpu-visualizer.mjs
          node playground/test-hlsl-highlight.mjs
          node playground/test-animation.mjs
