name: Release HLSL Playground v1.3.2 — Zig backend, no Rust/Node install

# Manual-only while Defender classification of previous binaries is investigated.
# No new distributable should publish without security review and evidence.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    # Requires an explicit reviewed-security decision; untrusted releases remain blocked.
    if: github.repository == 'Cryosimorgh/HLSL-Docs' && vars.WINDOWS_NATIVE_RELEASE_CLEARED == 'true'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Zig 0.13
        uses: mlugg/setup-zig@v2
        with:
          version: '0.13.0'
      # The release is gated on the real Zig HTTP compile endpoint, not only standalone DXC/Naga CLI checks.
      - name: Compile the Zig compiler backend
        shell: pwsh
        run: |
          $zigArgs = @('build-exe','playground/zig-server.zig','-O','ReleaseSafe','-mcpu','baseline','-femit-bin=playground/hlsl-server.exe')
          & zig @zigArgs
          if ($LASTEXITCODE -ne 0) { throw 'Zig backend build failed' }
      - name: Smoke test compiled Zig API, sessions and automatic shutdown
        shell: pwsh
        run: |
          node playground/test-zig.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Zig backend contract test failed' }
      - name: Download Microsoft DXC Windows distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'dxc-release'
          $zip = Join-Path $env:RUNNER_TEMP 'dxc-release.zip'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $url = 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 4 -RetryIntervalSec 10
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          $exe = Join-Path $dir 'bin\x64\dxc.exe'
          if (-not (Test-Path $exe)) { throw 'DXC archive lacks bin/x64/dxc.exe' }
          & $exe -help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Bundled DXC cannot run' }
      - name: Reuse prebuilt Naga CLI from prior verified Windows release (no Rust installation)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'previous-windows-release.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'previous-windows-release'
          $root = Join-Path $env:RUNNER_TEMP 'naga-release'
          New-Item -ItemType Directory -Force (Join-Path $root 'bin') | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/Cryosimorgh/HLSL-Docs/releases/download/v1.2.0/HLSL-Playground-Windows-v1.2.0.zip' -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 10
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $original = Join-Path $extract 'HLSL-Playground-Windows-v1.2.0\tools\naga\naga.exe'
          if (-not (Test-Path $original)) { throw 'Previous release missing naga.exe' }
          Copy-Item -LiteralPath $original -Destination (Join-Path $root 'bin\naga.exe')
          & (Join-Path $root 'bin\naga.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Naga binary cannot run' }
      - name: Verify compiler conversion on actual HLSL source
        shell: pwsh
        run: |
          $dxc = Join-Path $env:RUNNER_TEMP 'dxc-release\bin\x64\dxc.exe'
          $naga = Join-Path $env:RUNNER_TEMP 'naga-release\bin\naga.exe'
          $spv = Join-Path $env:RUNNER_TEMP 'particle.spv'
          $wgsl = Join-Path $env:RUNNER_TEMP 'particle.wgsl'
          $compileArgs = @('-spirv','-fspv-target-env=vulkan1.1','-T','cs_6_0','-E','CSMain','-fvk-t-shift','0','0','-fvk-u-shift','16','0','-fvk-b-shift','32','0','-fvk-s-shift','48','0','-Fo',$spv,'playground/particle-step.hlsl')
          & $dxc @compileArgs
          if ($LASTEXITCODE -ne 0) { throw 'DXC did not compile the starter HLSL' }
          & $naga $spv $wgsl
          if ($LASTEXITCODE -ne 0) { throw 'Naga could not translate starter SPIR-V' }
          if (-not (Test-Path $wgsl)) { throw 'Naga WGSL output missing' }
          if (-not (Select-String -LiteralPath $wgsl -Pattern '@compute' -Quiet)) { throw 'WGSL has no compute entry' }
      - name: Verify clean source checkout auto-download and boot (no DXC/Naga preinstalled)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isolated = Join-Path $env:RUNNER_TEMP 'checkout-without-tools'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          Copy-Item -LiteralPath 'Start-HLSL-Playground.ps1' -Destination $isolated
          $env:HLSL_BOOTSTRAP_CACHE = Join-Path $env:RUNNER_TEMP 'source-bootstrap-cache'
          try {
            & (Join-Path $isolated 'Start-HLSL-Playground.ps1') -NoBrowser
            $cached = Join-Path $env:HLSL_BOOTSTRAP_CACHE 'HLSL-Playground-Windows-v1.3.1'
            if (-not (Test-Path (Join-Path $cached 'tools\dxc\dxc.exe'))) { throw 'Checkout bootstrap did not fetch DXC' }
            if (-not (Test-Path (Join-Path $cached 'tools\naga\naga.exe'))) { throw 'Checkout bootstrap did not fetch Naga' }
            if (-not (Test-Path (Join-Path $cached 'playground\hlsl-server.exe'))) { throw 'Checkout bootstrap did not fetch Zig runtime' }
            $runtimeLogs = Join-Path $cached '.playground-runtime'
            $ready = Get-ChildItem -LiteralPath $runtimeLogs -File -Filter ready.json -Recurse |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $ready) { throw 'Checkout bootstrap did not launch the service' }
            $service = Get-Content -LiteralPath $ready.FullName -Raw | ConvertFrom-Json
            $health = Invoke-RestMethod -Uri "$($service.url)/api/health"
            if ($health.backend -ne 'zig') { throw 'Expected Zig API from checkout launcher' }
            $session = Invoke-RestMethod -Uri "$($service.url)/api/session/open" -Method Post -ContentType 'application/json' -Body '{}'
            $payload = @{ token = $session.token } | ConvertTo-Json -Compress
            Invoke-RestMethod -Uri "$($service.url)/api/session/close" -Method Post -ContentType 'application/json' -Body $payload | Out-Null
            $stopped = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              if (-not (Get-Process -Id $service.pid -ErrorAction SilentlyContinue)) {
                $stopped = $true
                break
              }
            }
            if (-not $stopped) {
              Stop-Process -Id $service.pid -Force -ErrorAction SilentlyContinue
              throw 'Checkout runtime did not stop after final browser session'
            }
            Write-Host 'PASS: clean checkout auto-download, SHA256 verification, launch, Zig health and shutdown'
          } finally {
            Remove-Item Env:\HLSL_BOOTSTRAP_CACHE -ErrorAction SilentlyContinue
          }
      - name: Assemble portable Windows and source ZIPs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'release-assets'
          $portable = Join-Path $out 'HLSL-Playground-Windows-v1.3.2'
          $source = Join-Path $out 'HLSL-Playground-Source-v1.3.2'
          foreach ($folder in @($portable, $source)) {
            New-Item -ItemType Directory -Path $folder -Force | Out-Null
            foreach ($name in @('playground','.agents','docs')) {
              Copy-Item -LiteralPath $name -Destination $folder -Recurse
            }
            foreach ($name in @('Start-HLSL-Playground.cmd','Start-HLSL-Playground.ps1',
                'README-WINDOWS.txt','README.md','HLSL-Handbook.md','LICENSE',
                'THIRD_PARTY_NOTICES.md','RELEASE_NOTES_v1.3.2.md')) {
              Copy-Item -LiteralPath $name -Destination $folder
            }
          }
          New-Item -ItemType Directory -Force (Join-Path $portable 'tools\dxc'),(Join-Path $portable 'tools\naga') | Out-Null
          if (-not (Test-Path (Join-Path $portable 'playground\hlsl-server.exe'))) { throw 'Compiled Zig backend missing from archive' }
          $dxcBin = Join-Path $env:RUNNER_TEMP 'dxc-release\bin\x64'
          foreach ($name in @('dxc.exe','dxcompiler.dll','dxil.dll')) {
            $sourceBinary = Join-Path $dxcBin $name
            if (Test-Path $sourceBinary) {
              Copy-Item -LiteralPath $sourceBinary -Destination (Join-Path $portable 'tools\dxc')
            } elseif ($name -ne 'dxil.dll') {
              throw "Missing essential DXC binary: $name"
            }
          }
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'naga-release\bin\naga.exe') -Destination (Join-Path $portable 'tools\naga\naga.exe')
          $licenses = Join-Path $portable 'tools\licenses'
          New-Item -ItemType Directory -Force $licenses | Out-Null
          $dxcLicenses = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'dxc-release') -File |
            Where-Object { $_.Name -match '^(license|notice|thirdparty)' }
          foreach ($item in $dxcLicenses) { Copy-Item -LiteralPath $item.FullName -Destination $licenses }
          # Zig source is included in playground/zig-server.zig.
          # Neither the Zig compiler, Node.js, Cargo nor Rust is shipped.
          foreach ($folder in @($portable, $source)) {
            if (-not (Test-Path (Join-Path $folder 'Start-HLSL-Playground.cmd'))) { throw 'Missing launcher' }
          }
          # Smoke-test the actual bundled PowerShell launcher with no browser UI.
          & (Join-Path $portable 'Start-HLSL-Playground.ps1') -NoBrowser
          # A PowerShell script reports failures with throw, not LASTEXITCODE.
          # Verify the service and lifecycle directly below.
          $runtimeDir = Join-Path $portable '.playground-runtime'
          $ready = Get-ChildItem -LiteralPath $runtimeDir -File -Filter ready.json -Recurse |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $ready) { throw 'Launcher did not create readiness marker' }
          $service = Get-Content -LiteralPath $ready.FullName -Raw | ConvertFrom-Json
          $session = Invoke-RestMethod -Uri "$($service.url)/api/session/open" -Method Post -ContentType 'application/json' -Body '{}'
          # End-to-end integration: compile source THROUGH THE ZIG SERVER using
          # the actual bundled DXC and prebuilt Naga (not separate CLI calls).
          $hlsl = Get-Content -LiteralPath 'playground/particle-step.hlsl' -Raw
          $compileBody = @{ source = $hlsl; entry = 'CSMain' } | ConvertTo-Json -Compress
          try {
            $compiled = Invoke-RestMethod -Uri "$($service.url)/api/compile" -Method Post -ContentType 'application/json' -Body $compileBody
          } catch {
            Write-Host '=== Zig backend compiler service diagnostics ==='
            Get-ChildItem -LiteralPath $runtimeDir -File -Recurse -Filter '*.log' |
              ForEach-Object { Write-Host $_.FullName; Get-Content -LiteralPath $_.FullName -Tail 100 }
            throw
          }
          if (-not $compiled.wgsl -or $compiled.wgsl -notmatch '@compute') {
            throw 'Zig backend failed to return converted compute WGSL'
          }
          $payload = @{ token = $session.token } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "$($service.url)/api/session/close" -Method Post -ContentType 'application/json' -Body $payload | Out-Null
          $stopped = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 250
            if (-not (Get-Process -Id $service.pid -ErrorAction SilentlyContinue)) {
              $stopped = $true
              break
            }
          }
          if (-not $stopped) {
            Stop-Process -Id $service.pid -Force -ErrorAction SilentlyContinue
            throw 'Bundled Zig service remained alive after final tab closed'
          }
          Remove-Item -LiteralPath $runtimeDir -Recurse -Force
          $portableZip = Join-Path $out 'HLSL-Playground-Windows-v1.3.2.zip'
          $sourceZip = Join-Path $out 'HLSL-Playground-Source-v1.3.2.zip'
          Remove-Item -LiteralPath (Join-Path $source 'playground\hlsl-server.exe') -ErrorAction SilentlyContinue
          Compress-Archive -LiteralPath $portable -DestinationPath $portableZip -CompressionLevel Optimal
          Compress-Archive -LiteralPath $source -DestinationPath $sourceZip -CompressionLevel Optimal
          if (-not (Test-Path $portableZip) -or -not (Test-Path $sourceZip)) { throw 'ZIP packaging failed' }
      - name: Publish versioned GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v1.3.2 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'v1.3.2 already exists: refusing to overwrite.' }
          $dir = Join-Path $env:RUNNER_TEMP 'release-assets'
          gh release create v1.3.2 (Join-Path $dir 'HLSL-Playground-Windows-v1.3.2.zip') (Join-Path $dir 'HLSL-Playground-Source-v1.3.2.zip') --target $env:GITHUB_SHA --title 'HLSL Playground v1.3.2 — Zig backend, zero Rust or Node setup' --notes-file RELEASE_NOTES_v1.3.2.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed' }
