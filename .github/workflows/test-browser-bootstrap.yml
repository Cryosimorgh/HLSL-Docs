name: Browser startup and manifestless animation regression

on:
  push:
    branches: [main]
    paths:
      - 'playground/index.html'
      - 'playground/live-runner.js'
      - 'playground/animation-runner.js'
      - 'playground/gpu-visualizer.js'
      - 'playground/hlsl-fold-docs.js'
      - 'playground/hlsl-docs-data.js'
      - 'playground/hlsl-reference.html'
      - 'playground/hlsl-reference.js'
      - 'playground/workbench.css'
      - 'playground/test-browser-bootstrap.mjs'
      - '.github/workflows/test-browser-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load real HTML and deferred scripts in headless Chromium
        run: node playground/test-browser-bootstrap.mjs
