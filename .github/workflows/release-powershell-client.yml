name: Release PowerShell HLSL client v1.8.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-powershell-client.yml']
permissions:
  contents: write
jobs:
  windows-client:
    if: github.repository == 'Cryosimorgh/HLSL-Docs'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test editor and local HTTP API
        shell: pwsh
        run: |
          # Ship offline HLSL help, validate assets and exercise the local compiler bridge.
          node playground/test-frontend.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Frontend test failed' }
          node playground/test-gpu-visualizer.mjs
          if ($LASTEXITCODE -ne 0) { throw 'GPU output geometry test failed' }
          node playground/test-hlsl-highlight.mjs
          if ($LASTEXITCODE -ne 0) { throw 'HLSL syntax highlight and editing test failed' }
          node playground/test-animation.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Continuous GPU animation lifecycle test failed' }
          node playground/test-framebuffer.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Source-only RGBA framebuffer test failed' }
          node playground/test-powershell.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Server test failed' }
      - name: Download upstream DXC and extract prebuilt Naga
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dxcZip=Join-Path $env:RUNNER_TEMP 'dxc.zip'
          $dxcDir=Join-Path $env:RUNNER_TEMP 'dxc'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' -OutFile $dxcZip -MaximumRetryCount 4 -RetryIntervalSec 10
          Expand-Archive -LiteralPath $dxcZip -DestinationPath $dxcDir -Force
          $dxc=Join-Path $dxcDir 'bin\x64\dxc.exe'
          if (-not (Test-Path $dxc)) { throw 'DXC missing' }
          $nagaZip=Join-Path $env:RUNNER_TEMP 'prior-tools.zip'
          $naga=Join-Path $env:RUNNER_TEMP 'naga.exe'
          Invoke-WebRequest -Uri 'https://github.com/Cryosimorgh/HLSL-Docs/releases/download/v1.2.0/HLSL-Playground-Windows-v1.2.0.zip' -OutFile $nagaZip -MaximumRetryCount 4 -RetryIntervalSec 10
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[IO.Compression.ZipFile]::OpenRead($nagaZip)
          try {
            $entry=$archive.Entries | Where-Object { $_.FullName -eq 'HLSL-Playground-Windows-v1.2.0/tools/naga/naga.exe' } | Select-Object -First 1
            if (-not $entry) { throw 'Naga missing' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,$naga,$true)
          } finally { $archive.Dispose() }
          & $naga --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Naga binary did not run' }
      - name: Test real HLSL compilation over the PowerShell HTTP API
        shell: pwsh
        run: |
          $env:HLSL_TEST_DXC=Join-Path $env:RUNNER_TEMP 'dxc\bin\x64\dxc.exe'
          $env:HLSL_TEST_NAGA=Join-Path $env:RUNNER_TEMP 'naga.exe'
          node playground/test-powershell.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Real compiler test failed' }
      - name: Package portable client and compiler-only archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'hlsl-v1.5'
          $app=Join-Path $out 'HLSL-Playground-Windows-v1.8.2'
          $toolOnly=Join-Path $out 'compiler-only'
          foreach ($dir in @($app,(Join-Path $app 'playground'),(Join-Path $app 'tools\dxc'),(Join-Path $app 'tools\naga'),(Join-Path $toolOnly 'tools\dxc'),(Join-Path $toolOnly 'tools\naga'))) {
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }
          foreach ($name in @('index.html','workbench.css','hlsl-highlight.js','hlsl-docs-data.js','hlsl-fold-docs.js','hlsl-reference.js','hlsl-reference.html','live-runner.js','animation-runner.js','browser-gpu.js','gpu-visualizer.js','julia-loop.hlsl','julia-rgba.hlsl','particles-rgba.hlsl','circle-mask.hlsl','particle-step.hlsl','server.ps1','README.md')) {
            Copy-Item -LiteralPath (Join-Path 'playground' $name) -Destination (Join-Path $app 'playground')
          }
          if (-not (Test-Path -LiteralPath (Join-Path $app 'playground\hlsl-highlight.js'))) {
            throw 'Full Windows ZIP must contain the HLSL syntax colorer'
          }
          foreach ($asset in @('animation-runner.js','julia-loop.hlsl','julia-rgba.hlsl','particles-rgba.hlsl','gpu-visualizer.js','hlsl-docs-data.js','hlsl-fold-docs.js','hlsl-reference.js','hlsl-reference.html')) {
            if (-not (Test-Path -LiteralPath (Join-Path (Join-Path $app 'playground') $asset))) {
              throw "Full Windows ZIP is missing required animation asset: $asset"
            }
          }
          foreach ($name in @('Start-HLSL-Playground.cmd','Start-HLSL-Playground.ps1','README-WINDOWS.txt','README.md','HLSL-Handbook.md','RELEASE_NOTES_v1.8.2.md','LICENSE','THIRD_PARTY_NOTICES.md')) {
            Copy-Item -LiteralPath $name -Destination $app
          }
          Copy-Item -LiteralPath 'docs' -Destination $app -Recurse
          $dxcBin=Join-Path $env:RUNNER_TEMP 'dxc\bin\x64'
          foreach ($name in @('dxc.exe','dxcompiler.dll','dxil.dll')) {
            $from=Join-Path $dxcBin $name
            if(Test-Path $from) {
              Copy-Item -LiteralPath $from -Destination (Join-Path $app 'tools\dxc')
              Copy-Item -LiteralPath $from -Destination (Join-Path $toolOnly 'tools\dxc')
            } elseif($name -ne 'dxil.dll') { throw "Required DXC binary missing: $name" }
          }
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'naga.exe') -Destination (Join-Path $app 'tools\naga\naga.exe')
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'naga.exe') -Destination (Join-Path $toolOnly 'tools\naga\naga.exe')
          $actual=@(Get-ChildItem -LiteralPath $app -Recurse -File -Filter '*.exe' | Select-Object -ExpandProperty Name)
          if(@($actual | Where-Object { $_ -notin @('dxc.exe','naga.exe') }).Count -ne 0) { throw 'Unexpected executable! Custom server not allowed' }
          $appZip=Join-Path $out 'HLSL-Playground-Windows-v1.8.2.zip'
          $toolsZip=Join-Path $out 'HLSL-CompilerTools-v1.8.2.zip'
          Compress-Archive -LiteralPath $app -DestinationPath $appZip -CompressionLevel Optimal
          Compress-Archive -LiteralPath (Join-Path $toolOnly 'tools') -DestinationPath $toolsZip -CompressionLevel Optimal
          @($appZip,$toolsZip) | ForEach-Object {
            (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + (Split-Path -Leaf $_)
          } | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding Ascii
      - name: Test packaged launcher + HLSL compile + final-tab shutdown
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app=Join-Path $env:RUNNER_TEMP 'hlsl-v1.5\HLSL-Playground-Windows-v1.8.2'
          & (Join-Path $app 'Start-HLSL-Playground.ps1') -NoBrowser
          $ready=Get-ChildItem -LiteralPath $env:TEMP -Directory -Filter 'hlsl-playground-run-*' |
            Sort-Object LastWriteTime -Descending |
            ForEach-Object { Join-Path $_.FullName 'ready.json' } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if(-not $ready) { throw 'Launcher did not open a service' }
          $info=Get-Content -LiteralPath $ready -Raw | ConvertFrom-Json
          $health=Invoke-RestMethod -Uri "$($info.url)/api/health"
          if($health.backend -ne 'powershell-dotnet') { throw 'Wrong server backend' }
          $styles=Invoke-WebRequest -Uri "$($info.url)/workbench.css" -UseBasicParsing
          if($styles.StatusCode -ne 200 -or $styles.Headers.'Content-Type' -notmatch 'text/css') {
            throw 'Redesigned stylesheet missing from packaged localhost server'
          }
          $syntax=Invoke-WebRequest -Uri "$($info.url)/hlsl-highlight.js" -UseBasicParsing
          if($syntax.StatusCode -ne 200 -or $syntax.Content -notmatch 'HLSLHighlight') {
            throw 'HLSL highlighting script missing from packaged client'
          }
          foreach($asset in @('hlsl-docs-data.js','hlsl-fold-docs.js','hlsl-reference.js','hlsl-reference.html')) {
            $doc=Invoke-WebRequest -Uri "$($info.url)/$asset" -UseBasicParsing
            if($doc.StatusCode -ne 200) { throw "Packaged documentation asset unavailable: $asset" }
          }
          $page=Invoke-WebRequest -Uri "$($info.url)/" -UseBasicParsing
          if($page.Content -notmatch 'id="code-sections"' -or $page.Content -notmatch 'hlsl-help-tooltip') {
            throw 'Packaged HTML missing code folding or contextual hover documentation'
          }
          $anim=Invoke-WebRequest -Uri "$($info.url)/animation-runner.js" -UseBasicParsing
          if($anim.StatusCode -ne 200 -or $anim.Content -notmatch 'requestAnimationFrame') {
            throw 'Continuous animation engine not served by packaged client'
          }
          $session=Invoke-RestMethod -Uri "$($info.url)/api/session/open" -Method POST -ContentType 'application/json' -Body '{}'
          try {
            $visual=Invoke-WebRequest -Uri "$($info.url)/gpu-visualizer.js" -UseBasicParsing
            if($visual.StatusCode -ne 200) { throw 'Visual output script is missing from package server' }
            foreach($sample in @('particle-step.hlsl','circle-mask.hlsl','julia-loop.hlsl','julia-rgba.hlsl','particles-rgba.hlsl')) {
              $src=Get-Content -LiteralPath (Join-Path 'playground' $sample) -Raw
              $body=@{entry='CSMain';source=$src} | ConvertTo-Json -Compress
              $result=Invoke-RestMethod -Uri "$($info.url)/api/compile" -Method POST -ContentType 'application/json' -Body $body
              if($result.wgsl -notmatch '@compute') { throw "Compiled shader not returned for $sample" }
            }
          } finally {
            $close=@{token=$session.token} | ConvertTo-Json -Compress
            Invoke-RestMethod -Uri "$($info.url)/api/session/close" -Method POST -ContentType 'application/json' -Body $close | Out-Null
          }
          $exited=$false
          for($i=0;$i -lt 40;$i++){
            Start-Sleep -Milliseconds 250
            if(-not (Get-Process -Id $info.pid -ErrorAction SilentlyContinue)) { $exited=$true; break }
          }
          if(-not $exited) {
            Stop-Process -Id $info.pid -Force -ErrorAction SilentlyContinue
            throw 'Process failed to stop after final tab'
          }
          Write-Host 'PASS packaged HLSL client, real compile API and cleanup'
      - name: Publish downloadable Windows client
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release view v1.8.2 *> $null
          if($LASTEXITCODE -eq 0) { throw 'v1.8.2 already exists' }
          $out=Join-Path $env:RUNNER_TEMP 'hlsl-v1.5'
          gh release create v1.8.2 (Join-Path $out 'HLSL-Playground-Windows-v1.8.2.zip') (Join-Path $out 'HLSL-CompilerTools-v1.8.2.zip') (Join-Path $out 'SHA256SUMS.txt') --target $env:GITHUB_SHA --title 'HLSL Workbench v1.8.2 — Code Folding and Hover HLSL Reference' --notes-file RELEASE_NOTES_v1.8.2.md
          if($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
