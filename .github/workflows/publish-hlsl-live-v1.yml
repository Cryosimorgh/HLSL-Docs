name: Release HLSL Editor + WebGPU Runner v1.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hlsl-live-v1.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'Cryosimorgh/HLSL-Docs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mandatory editor + local compiler API smoke test
        run: node playground/test.mjs
      - name: Package skill, editable tutorial and reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/hlsl-engineer-v1.1.0
          cp -R .agents/skills/hlsl-engineer release/hlsl-engineer-v1.1.0/hlsl-engineer
          cp -R playground docs release/hlsl-engineer-v1.1.0/
          cp HLSL-Handbook.md README.md LICENSE RELEASE_NOTES_v1.1.0.md release/hlsl-engineer-v1.1.0/
          (cd release && zip -qr hlsl-engineer-v1.1.0.zip hlsl-engineer-v1.1.0)
          unzip -tq release/hlsl-engineer-v1.1.0.zip
      - name: Publish immutable v1.1.0 GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'v1.1.0 already exists. Refusing to overwrite.'
            exit 0
          fi
          gh release create v1.1.0 \
            release/hlsl-engineer-v1.1.0.zip \
            --target "$GITHUB_SHA" \
            --title "HLSL Engineer v1.1.0 — Editable Shader Playground" \
            --notes-file RELEASE_NOTES_v1.1.0.md
